services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: glitr
      POSTGRES_PASSWORD: glitr
      POSTGRES_DB: glitr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: